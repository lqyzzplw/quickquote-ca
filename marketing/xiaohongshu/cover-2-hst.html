<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>小红书 Cover #2 — HST 干货</title>
<style>
  :root {
    --ink:    #0a0a0a;
    --bg:     #fffbeb;       /* 暖色干货底，比白色更"教程感" */
    --accent: #d97706;       /* 警示橙 */
    --blue:   #2563eb;
    --red:    #dc2626;
    --muted:  #78716c;
    --line:   #e7e5e4;
    --card:   #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1440px;
    font-family: -apple-system, "PingFang SC", "Heiti SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .canvas {
    width: 100%;
    height: 100%;
    padding: 80px 70px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  /* Top "干货" badge */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--accent);
    color: white;
    padding: 16px 32px;
    border-radius: 16px;
    font-size: 32px;
    font-weight: 700;
    width: fit-content;
    transform: rotate(-2deg);
    box-shadow: 0 8px 0 rgba(217, 119, 6, 0.25);
    margin-bottom: 50px;
  }

  /* Main headline */
  .headline {
    font-size: 120px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.02em;
  }
  .headline .ca {
    color: var(--red);
  }
  .headline .accent {
    color: var(--accent);
    border-bottom: 12px solid var(--accent);
    padding-bottom: 4px;
  }

  .subhead {
    margin-top: 32px;
    font-size: 38px;
    color: var(--muted);
    font-weight: 500;
    line-height: 1.4;
  }

  /* Province rates grid — looks like a cheat sheet */
  .grid {
    margin-top: auto;
    background: var(--card);
    border: 2px solid var(--ink);
    border-radius: 28px;
    padding: 40px 36px;
    box-shadow: 12px 12px 0 var(--ink);
  }
  .grid-title {
    font-size: 28px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .grid-title::before {
    content: "📌";
    font-size: 28px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 0;
    border-bottom: 1px solid var(--line);
    font-size: 36px;
  }
  .row:last-child { border-bottom: none; }
  .row .province {
    font-weight: 600;
    color: var(--ink);
  }
  .row .tax {
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .row .tax .small {
    font-size: 24px;
    color: var(--muted);
    font-weight: 500;
    margin-left: 8px;
  }

  /* Footer */
  .brand {
    margin-top: 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 26px;
    color: var(--muted);
    font-weight: 500;
  }
  .brand .name {
    font-weight: 700;
    color: var(--ink);
  }

  /* Decorative tape strips */
  .tape {
    position: absolute;
    width: 200px;
    height: 50px;
    background: rgba(217, 119, 6, 0.35);
    transform: rotate(-15deg);
    top: 60px;
    right: -50px;
    z-index: 0;
  }
  .canvas > * { position: relative; z-index: 1; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="tape"></div>

    <div class="badge">🎯 干货收藏</div>

    <h1 class="headline">
      <span class="ca">🇨🇦 加拿大</span>报价<br>
      <span class="accent">HST</span> 必懂规则
    </h1>

    <p class="subhead">
      $30,000 注册线 · 跨省税率 · 三大坑<br>
      自雇 / 装修 / 服务业必看
    </p>

    <div class="grid">
      <div class="grid-title">各省税率速查</div>
      <div class="row">
        <span class="province">安省 ON</span>
        <span class="tax">13%<span class="small">HST</span></span>
      </div>
      <div class="row">
        <span class="province">BC 省</span>
        <span class="tax">5% + 7%<span class="small">GST + PST</span></span>
      </div>
      <div class="row">
        <span class="province">魁省 QC</span>
        <span class="tax">5% + 9.975%<span class="small">GST + QST</span></span>
      </div>
      <div class="row">
        <span class="province">阿省 AB</span>
        <span class="tax">5%<span class="small">GST only</span></span>
      </div>
    </div>

    <div class="brand">
      <div class="name">⚡ QuickQuote CA</div>
      <div>👉 主页链接</div>
    </div>
  </div>
</body>
</html>

name: Supabase Keepalive

# Hits the production /api/cron/keepalive endpoint every day at 00:00 UTC.
# Acts as a fallback for the Vercel cron defined in vercel.json — Vercel
# Hobby tier is unreliable about firing daily crons, so this redundant
# trigger guarantees the Supabase free-tier project doesn't auto-pause
# after 7 days of inactivity.

on:
  schedule:
    # Daily at 00:00 UTC. Vercel cron runs at 12:00 UTC — together they give
    # two pings per day, ~12h apart, well inside the 7-day pause window.
    - cron: "0 0 * * *"
  # Allow manual runs from the Actions tab for testing.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hit /api/cron/keepalive
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          response=$(curl -fsS \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -w "\nHTTP_STATUS:%{http_code}\n" \
            https://quickquote-ca.vercel.app/api/cron/keepalive)
          echo "$response"
          # Fail the job if the JSON body doesn't include "ok":true
          echo "$response" | grep -q '"ok":true'
